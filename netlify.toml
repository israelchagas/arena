[build]
  command   = "pnpm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command     = "pnpm run dev"
  targetPort  = 3010
  port        = 8888
  autoLaunch  = false

# SPA redirect
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
